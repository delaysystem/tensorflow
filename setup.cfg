[codespell]
# Word list, skip list, and ignore list for the codespell presubmit check
# (see .github/workflows/codespell-presubmit.yml). Every entry in
# ignore-words-list below was verified as a false positive in context before
# being added here; see the tracking issue for the verification record.
# NOTE: flag-style keys (e.g. check-filenames) must keep an empty value:
# codespell maps each key to a CLI flag and appends any non-empty value.
skip = *.pyc,*.pyo,*.o,*.so,*.a,*.pb.cc,*.pb.h,*_pb2.py,*_pb2.pyi,*.pbtxt,*.bin,*.ckpt,*.tflite,*.onnx,*.h5,*.npy,*.npz,*.csv,*.tsv,*.json,*.lock,yarn.lock,*.min.js,*.min.css,*.map,*.pdf,*.png,*.jpg,*.ico,*.woff,*.woff2,*.ttf,*.eot,./third_party/*,./tensorflow/lite/testdata/*,./tensorflow/python/kernel_tests/testdata/*
ignore-words-list = ans,coo,ist,mape,nd,numer,strat
check-filenames =
